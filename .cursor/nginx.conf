# Cloud agent dev server. .cursor/serve.sh substitutes __ROOT__ and __CONFDIR__.
worker_processes auto;
pid __CONFDIR__/nginx.pid;
error_log __CONFDIR__/nginx-error.log warn;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log __CONFDIR__/nginx-access.log;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 1000;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/xml+rss;

    upstream inlay_php {
        server 127.0.0.1:9081;
        server 127.0.0.1:9082;
        server 127.0.0.1:9083;
        server 127.0.0.1:9084;
        keepalive 16;
    }

    server {
        listen 8000;
        server_name _;
        root __ROOT__/public;
        client_max_body_size 32m;

        # Files in public/ are the document root. CSS, fonts, and theme
        # images live beside public/ and are served from the install root.
        # Proxy everything else, including /, with the original URI.
        # Rewriting / to /index.php makes bootstrap redirect back to /.
        location ~* ^/(layouts|site/themes)/.+\.(css|js|svg|png|jpe?g|gif|webp|ico|woff2?)$ {
            root __ROOT__;
            try_files $uri @php;
            add_header Cache-Control "public, max-age=300";
        }

        location / {
            try_files $uri @php;
        }

        location ~ \.php$ {
            proxy_pass http://inlay_php;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location @php {
            proxy_pass http://inlay_php;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
